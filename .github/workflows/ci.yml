name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Python and viewer regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ultra.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install optional integrations in a local environment
        run: |
          python -m venv .local/ultra-full-venv
          .local/ultra-full-venv/bin/python -m pip install -r requirements-ultra.txt
      - name: Check repository and documentation
        run: python tools/check_repo.py
      - name: Run Python and viewer checks without credentials
        run: python tools/check_ultra.py
      - name: Check whitespace
        run: git diff --check

  native:
    name: Compile macOS helpers
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build desktop, speech and screen-watch helpers
        run: |
          sh native/build_desktop.sh
          sh native/build_voice.sh
          sh native/build_watch.sh
